[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "varrior-labs-fx-analytics"
version = "0.0.1"
description = "Deterministic EUR/USD quantitative research and validation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=16",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
mt5 = [
  "MetaTrader5>=5.0; platform_system == 'Windows'",
]
dashboard = [
  "pandas>=2.2",
  "plotly>=5.24",
  "streamlit>=1.36",
]
dev = [
  "build>=1.2",
]

[project.scripts]
demo-beta = "demo_beta.cli:main"

[project.urls]
Repository = "https://github.com/pavmarshyk0/varrior-labs-fx-analytics"
Issues = "https://github.com/pavmarshyk0/varrior-labs-fx-analytics/issues"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "demo_beta*",
  "engine*",
  "analytics*",
  "data_ingestion*",
]
exclude = [
  "tests*",
  "data*",
  "docs*",
  "notebooks*",
]
