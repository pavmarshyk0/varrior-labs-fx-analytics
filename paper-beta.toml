[risk]
min_planned_rr = 3.0
max_risk_fraction = 0.01
default_paper_risk_fraction = 0.005
fixed_rr_control_baseline = true

[execution]
pip_size = 0.0001
entry_slippage_pips = 0.0
exit_slippage_pips = 0.0
latency_ms = 0

[macro_guard]
# Research starting values only. Freeze only after walk-forward validation.
pre_veto_seconds = 300
post_veto_seconds = 900
parameter_status = "UNVALIDATED_RESEARCH_DEFAULT"

[benchmark_windows]
# Context windows, not directional signals.
half_width_minutes = 15

[research]
pair = "EUR_USD"
canonical_timezone = "UTC"
minimum_oos_trades = 250
target_frequency_per_week_min = 2.0
target_frequency_per_week_max = 5.0
mode = "RESEARCH"

[research.reliability]
insufficient_below = 30
low_below = 100
medium_below = 200
shrinkage_prior_weight = 50.0

[research.ranking]
net_expectancy = 0.35
stability = 0.20
confidence = 0.15
regime_robustness = 0.15
tail_execution_robustness = 0.15
